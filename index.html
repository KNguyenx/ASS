<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Thần Tôn Quyền - Tam Quốc Sát</title>

<style>
:root {
    --bg-primary: #1a1625;
    --bg-panel: #262035;
    --bg-card: #322a45;
    --bg-card-hover: #4a3e66;
    --accent-purple: #8b5cf6;
    --accent-purple-hover: #7c3aed;
    --accent-green: #10b981;
    --accent-green-hover: #059669;
    --accent-red: #ef4444;
    --accent-red-hover: #dc2626;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border-color: #43385d;
    --border-highlight: #6b5299;
}

* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    background: var(--bg-primary);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    min-height: 100vh;
    line-height: 1.5;
}

header {
    padding: 24px 16px;
    text-align: center;
    background: linear-gradient(180deg, #120e1a 0%, var(--bg-primary) 100%);
    border-bottom: 1px solid var(--border-color);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

h1 {
    margin: 0 0 8px;
    font-size: 26px;
    letter-spacing: 1px;
    color: #f3e8ff;
    text-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
}

.sub {
    color: var(--text-muted);
    font-size: 14px;
}

.wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 16px;
}

.panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}

h2 {
    margin: 0 0 8px;
    font-size: 20px;
    color: #e9d5ff;
    display: flex;
    align-items: center;
    gap: 8px;
}

.note {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}

.card-btn {
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-main);
    border-radius: 12px;
    padding: 14px 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.card-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-highlight);
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
}

.card-btn.hidden {
    display: none;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.action {
    border: 1px solid var(--border-highlight);
    border-radius: 10px;
    background: var(--bg-card);
    color: var(--text-main);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.action:hover {
    background: var(--bg-card-hover);
    transform: translateY(-1px);
}

.action.enter-btn {
    background: var(--accent-purple);
    border-color: var(--accent-purple-hover);
    color: #fff;
    font-weight: 600;
}

.action.enter-btn:hover {
    background: var(--accent-purple-hover);
}

.action.summary-btn {
    background: var(--accent-green);
    border-color: var(--accent-green-hover);
    color: #fff;
    font-weight: 600;
}

.action.summary-btn:hover {
    background: var(--accent-green-hover);
}

.action.reset {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    margin-left: auto;
}

.action.reset:hover {
    background: var(--accent-red);
    color: #fff;
}

/* Tab Navigation Styling */
.tabs-header {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
    margin-bottom: 16px;
}

.tab-btn {
    background: #1d1829;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
}

.tab-btn:hover {
    color: var(--text-main);
    border-color: var(--border-highlight);
}

.tab-btn.active {
    background: var(--accent-purple);
    color: #fff;
    border-color: var(--accent-purple);
}

.tab-btn.summary-tab {
    border-color: var(--accent-green);
}

.tab-btn.summary-tab.active {
    background: var(--accent-green);
    color: #fff;
}

.tab-close {
    background: transparent;
    border: none;
    color: inherit;
    font-size: 12px;
    cursor: pointer;
    opacity: 0.7;
    border-radius: 50%;
    padding: 2px 4px;
}

.tab-close:hover {
    opacity: 1;
    background: rgba(0, 0, 0, 0.2);
}

.summary {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1d1829;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px 14px;
}

.item-name {
    font-weight: 600;
    color: #f3e8ff;
}

.count {
    font-weight: 700;
    font-size: 13px;
    background: var(--accent-purple);
    color: #fff;
    border-radius: 20px;
    padding: 3px 10px;
}

.empty {
    color: var(--text-muted);
    padding: 20px 0;
    text-align: center;
    font-style: italic;
    grid-column: 1 / -1;
}

.total {
    text-align: right;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
    color: var(--text-muted);
    font-size: 14px;
}

.total b {
    font-size: 22px;
    color: var(--accent-purple);
    margin-left: 6px;
}

@media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .summary { grid-template-columns: 1fr; }
    .actions { flex-direction: column; }
    .action.reset { margin-left: 0; }
}
</style>
</head>

<body>

<header>
    <h1>⚔ TOOL THẦN TÔN QUYỀN ⚔</h1>
    <div class="sub">
        Chọn danh bài → Nhấn Enter tạo Tab Người chơi → Nhấn "Tổng Kết" để tự lọc các danh bài khác nhau
    </div>
</header>

<div class="wrap">

    <!-- BẢNG CHỌN BÀI HIỆN TẠI -->
    <div class="panel">
        <h2>🎴 Chọn danh bài đang chọn</h2>
        <div class="note">
            Nhấp chọn danh bài. Nhấn phím <b>ENTER</b> để chốt bài cho Người chơi.
